# Portable-конвейер keklib-cli: нативные сборки четырёх target, изолированный
# smoke без checkout исходников и выпускной гейт; только по workflow_dispatch.
#
# Публичный GitHub Release и подписи не создаются — только проверенные
# CI-артефакты и SHA256SUMS после успеха гейта.
#
# ВАЖНО (честное поведение): у Windows/macOS SQLite-пин в
# packaging/toolchain.json сейчас null (без выдуманных значений), поэтому их
# сборки падают на release-гейте метаданных tools/build_portable.py, smoke и
# итоговый гейт не выполняются, а конвейер красный. Это ожидаемо до реальной
# нативной инвентаризации SQLite на этих target; никаких fake-pass нет.

name: portable-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Исходные тесты как reusable workflow (Linux/Windows/macOS × 3.11/3.14).
  source-tests:
    uses: ./.github/workflows/ci.yml

  # 2. Матрица target единственным источником — packaging/targets.json.
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.specs.outputs.specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Спецификации target
        id: specs
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          targets = json.loads(
              Path("packaging/targets.json").read_text(encoding="utf-8")
          )["targets"]
          items = [{"name": name, "runner": spec["runner"]}
                   for name, spec in targets.items()]
          print("specs=" + json.dumps(items))
          PY

  # 3. Вспомогательный harness-архив для smoke: tools/tests-harness и test-only
  #    Windows-lock. Не является частью пользовательской поставки.
  harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Собрать harness-архив
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          files = [
              "tools/smoke_portable.py",
              "tools/release_gate.py",
              "tests/__init__.py",
              "tests/harness/__init__.py",
              "tests/harness/library_fixture.py",
              "tests/harness/tty.py",
              "tests/harness/permissions.py",
              "packaging/requirements-test-windows.lock",
          ]
          out = Path("dist-harness/keklib-smoke-harness.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, Path(name).read_bytes())
          print(out)
          PY
      - name: Опубликовать harness-артефакт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-harness
          path: dist-harness/keklib-smoke-harness.zip

  # 4. Нативная сборка каждого target на своей ОС/CPU (кросс-сборка запрещена).
  build:
    needs: [source-tests, matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.specs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPython 3.14.8 (закреплённый toolchain)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Сборочные зависимости (точные пины с хешами)
        run: python -m pip install -r packaging/requirements-build.lock
      - name: Установка проекта (src-layout) в окружение job'а
        run: python -m pip install .
      - name: Сборка portable со всеми fail-closed гейтами
        run: python tools/build_portable.py --target ${{ matrix.name }} --output dist
      - name: Опубликовать архив комплекта
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keklib-cli-${{ matrix.name }}
          path: dist

  # 5. Изолированный smoke на новой машине БЕЗ checkout исходников приложения:
  #    только harness-архив и пользовательский артефакт; python тестового
  #    harness не содержит keklib_cli, child получает PATH без python.
  smoke:
    needs: [build, harness, matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.specs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Скачать harness
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-harness
          path: harness
      - name: Распаковать harness
        run: |
          python -m zipfile -e harness/keklib-smoke-harness.zip harness-src
      - name: CPython для тестового harness
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Скачать проверяемый комплект
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keklib-cli-${{ matrix.name }}
          path: bundle
      - name: Test-only зависимости harness (pywinpty на Windows по маркеру)
        run: python -m pip install -r harness-src/packaging/requirements-test-windows.lock
      - name: Изолированный frozen smoke
        shell: bash
        env:
          WORKDIR: ${{ runner.temp }}/keklib-smoke
        run: |
          shopt -s nullglob
          archives=(bundle/keklib-cli-*.tar.gz bundle/keklib-cli-*.zip)
          test "${#archives[@]}" -eq 1
          python harness-src/tools/smoke_portable.py --archive "${archives[0]}" --workdir "$WORKDIR"
          # Отчёт получает target-специфическое имя ДО upload: все четыре
          # smoke-job грузят файл с одинаковым basename, gate ожидает
          # smoke-report-<target>.json — без переименования артефакты
          # перезаписали бы друг друга при скачивании в один каталог.
          cp "$WORKDIR/smoke-report.json" "smoke-report-${{ matrix.name }}.json"
      - name: Опубликовать отчёт smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-${{ matrix.name }}
          path: smoke-report-${{ matrix.name }}.json

  # 6. Выпускной гейт: все исходные тесты, все сборки, все smoke-отчёты,
  #    контрольные суммы четырёх архивов и SHA256SUMS — только после успеха.
  gate:
    needs: [source-tests, matrix, build, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (targets.json и tools/release_gate.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Четыре target зафиксированы в packaging/targets.json; отсутствие
      # артефакта приводит к отказу соответствующего download-шага — гейт
      # не может пройти частичной матрицей.
      - name: Скачать linux-x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: keklib-cli-linux-x86_64, path: dist}
      - name: Скачать windows-x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: keklib-cli-windows-x86_64, path: dist}
      - name: Скачать macos-x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: keklib-cli-macos-x86_64, path: dist}
      - name: Скачать macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: keklib-cli-macos-arm64, path: dist}
      - name: Скачать отчёт linux-x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: smoke-report-linux-x86_64, path: reports}
      - name: Скачать отчёт windows-x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: smoke-report-windows-x86_64, path: reports}
      - name: Скачать отчёт macos-x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: smoke-report-macos-x86_64, path: reports}
      - name: Скачать отчёт macos-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: smoke-report-macos-arm64, path: reports}
      - name: Выпускной гейт (суммы, отчёты, SHA256SUMS)
        run: python tools/release_gate.py --artifacts dist --reports reports
      - name: Опубликовать проверенный комплект
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-portable
          path: |
            dist
            reports
