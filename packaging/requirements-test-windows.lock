# `winpty` (upstream pyproject: module-name = "winpty._winpty";
# `from winpty import PtyProcess`), модуля `pywinpty` не существует:
#   pywinpty==3.1.0
#
# Честный статус: на момент задачи 10 версия зафиксирована по данным PyPI,
# но установка и прогон выполнялись только на Linux (POSIX PTY-путь);
# нативная Windows-проверка этой зависимости — задача 12 плана.
# На POSIX/Windows-профиль не влияет: маркер sys_platform исключает
# установку вне Windows.

