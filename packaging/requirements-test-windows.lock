# Test-only зависимости нативных Windows TTY-тестов (задача 10 плана).
#
# Назначение: ConPTY-harness `tests/harness/tty.py` на Windows использует
# pywinpty; приложение `keklib_cli` и его runtime от этих пакетов НЕ зависят.
#
# Установка (только на Windows, в проектное окружение):
